services:
  api:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./uploads:/app/uploads"]
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      RESQNET_API_URL: http://api:8000
    depends_on: [api]
